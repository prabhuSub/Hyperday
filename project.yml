name: DayLive
options:
  bundleIdPrefix: com.prabhu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # filled by ./deploy.sh (saved in .team, not committed)
    CODE_SIGN_STYLE: Automatic

targets:
  DayLive:
    type: application
    platform: iOS
    scheme:             # shared scheme so ./deploy.sh can build from Terminal
      testTargets: [DayLiveTests]   # ⌘U runs the core-logic tests
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hyperday
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true   # portrait-only iPhone app; silences the orientation warning
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: "Hyperday reads your calendar events to show them in your day, calendar and Live Activity. They never leave your iPhone."
        NSPhotoLibraryAddUsageDescription: "Hyperday saves your weekly recap image to Photos when you tap Save image."
        NSHealthShareUsageDescription: "Hyperday reads your sleep and workouts to suggest a bedtime, tick workout blocks and show what makes your good days. It stays on your iPhone."
        NSLocationWhenInUseUsageDescription: "Hyperday uses your location to save Home, Office and Gym, so it can show when you actually arrived and left. It stays on your iPhone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Hyperday notices when you arrive at or leave Home, Office and Gym, even when it's closed, to fill in what really happened and learn your commute. It stays on your iPhone."
        NSCameraUsageDescription: "Hyperday reads dates and times from a whiteboard, flyer or ticket to turn them into blocks. Photos aren't saved."
        TeslaClientID: $(TESLA_CLIENT_ID)   # deploy.sh fills this from .tesla-keys/client.env (not a secret)
        HyperdaySignInWithApple: false   # true after joining the Apple Developer Program
        CFBundleURLTypes:
          - CFBundleURLName: com.prabhu.daylive
            CFBundleURLSchemes: [hyperday]
        UIBackgroundModes: [fetch]
        UIFileSharingEnabled: true              # Backups show in Files › On My iPhone › Hyperday
        LSSupportsOpeningDocumentsInPlace: true
        BGTaskSchedulerPermittedIdentifiers: [com.prabhu.daylive.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhu.daylive
        CODE_SIGN_ENTITLEMENTS: App/Hyperday.entitlements   # App Group + HealthKit (deploy.sh falls back if refused)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DayLiveWidget

  DayLiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/DayActivityAttributes.swift
      - Shared/BlockActionIntent.swift
      - Shared/LiveActivityViews.swift
      - Shared/WidgetData.swift
      - Shared/HDIcon.swift
      - Shared/Heatmap.swift
      - Shared/CarData.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hyperday
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhu.daylive.widget
        CODE_SIGN_ENTITLEMENTS: Hyperday.entitlements       # App Group
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  DayLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DayLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhu.daylive.tests
        GENERATE_INFOPLIST_FILE: YES
